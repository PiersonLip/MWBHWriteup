server {
    listen 80;
    server_name milkywaybhs.piersonl.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name milkywaybhs.piersonl.com;

    ssl_certificate /etc/letsencrypt/live/milkywaybhs.piersonl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milkywaybhs.piersonl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/milkywaybhs;
    index index.html;

    # HTML always revalidates so deploys show up without a hard refresh
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;
}
